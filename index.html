<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2744">
  <title>CRM روافد</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <div class="boot-splash"><div class="logo-circle">ر</div><p>CRM روافد</p></div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="print-area"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <!-- app.js متولّد من app/src/*.js عن طريق build.ps1 — متعدلش فيه مباشرة -->
  <script src="app.js"></script>
  <script>
  /* شبكة أمان: لو التطبيق مافتحش لأي سبب (خطأ في التحميل، بيانات محفوظة خربانة،
     مساحة الجهاز خلصت) المندوب كان بيفضل قدام شاشة بيضا ومش لاقي أي حل.
     دلوقتي بيظهرله زرار تصليح بيمسح المحفوظ على الجهاز بس (البيانات كلها على السيرفر). */
  (function () {
    var FIXED = false;
    window.crmRepair = function () {
      if (FIXED) return; FIXED = true;
      try { localStorage.clear(); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}
      var done = function () { location.reload(); };
      try {
        var jobs = [];
        if (window.caches && caches.keys) jobs.push(caches.keys().then(function (k) {
          return Promise.all(k.map(function (x) { return caches.delete(x); }));
        }));
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        Promise.all(jobs).then(done, done);
        setTimeout(done, 2500);
      } catch (e) { done(); }
    };
    function showRepair(why) {
      var el = document.getElementById('app');
      if (!el || el.getAttribute('data-repair') === '1') return;
      el.setAttribute('data-repair', '1');
      el.innerHTML =
        '<div style="max-width:22rem;margin:14vh auto;padding:0 1.2rem;text-align:center;' +
        'font-family:Tahoma,\'Segoe UI\',system-ui,sans-serif;direction:rtl;color:#101d2b">' +
        '<div style="font-size:44px">🛠️</div>' +
        '<h2 style="margin:.6rem 0">التطبيق مش راضي يفتح</h2>' +
        '<p style="color:#5d6a7a;line-height:1.8">في حاجة اتخربت في البيانات المحفوظة على الموبايل. ' +
        'اضغط الزرار ده — هيمسح المحفوظ على جهازك بس، وكل شغلك محفوظ على السيرفر ومش هيضيع.</p>' +
        '<button onclick="crmRepair()" style="background:#1f5fd0;color:#fff;border:0;border-radius:10px;' +
        'padding:.8rem 1.6rem;font-size:1rem;font-weight:700;cursor:pointer">تصليح وإعادة تشغيل</button>' +
        '<p style="color:#8a94a3;font-size:.8rem;margin-top:1.2rem">' + (why || '') + '</p></div>';
    }
    window.addEventListener('error', function (e) {
      if (!window.__crmStarted) showRepair(e && e.message ? String(e.message).slice(0, 120) : '');
    });
    setTimeout(function () { if (!window.__crmStarted) showRepair('التطبيق أخد وقت طويل ومافتحش'); }, 8000);
  })();
  </script>
</body>
</html>
